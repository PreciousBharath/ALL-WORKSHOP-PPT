SYSTEM CONFIGURATION
====================

[DATABASE]
host=localhost
port=5432
database=cryptochain_db
username=admin
password_hash=***ENCRYPTED***
connection_pool=10
timeout=30

[ENCRYPTION]
algorithm=AES-256
mode=CBC
key_size=256
pbkdf2_iterations=100000
salt_length=16
hash_algorithm=SHA-256

[BLOCKCHAIN]
difficulty=2
block_size=4096
consensus=ProofOfWork
mining_reward=1
transaction_fee=0.001

[SERVER]
host=0.0.0.0
port=5000
debug=true
workers=4
timeout=30
max_content_length=104857600

[SECURITY]
cors_enabled=true
cors_origins=*
session_timeout=1800
password_min_length=6
password_require_uppercase=true
password_require_numbers=true
password_require_symbols=true

[LOGGING]
level=INFO
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
file=/var/log/cryptochain/app.log
max_size=10485760
backup_count=10

[BACKUP]
enabled=true
schedule=daily
retention_days=30
location=/backups/cryptochain/
compression=gzip

[MONITORING]
enabled=true
metrics_enabled=true
health_check_interval=60
alert_threshold=0.8