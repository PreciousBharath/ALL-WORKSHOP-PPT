<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Introduction - Day 7</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Internal CSS -->
    <style>
        .internal-style {
            background-color: #e3f2fd;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>CSS Introduction</h1>
    
    <!-- Inline CSS Example -->
    <p style="color: red; font-size: 18px;">This is inline CSS styling.</p>
    
    <!-- Internal CSS Example -->
    <p class="internal-style">This uses internal CSS styling.</p>
    
    <!-- External CSS Example -->
    <p class="external-style">This uses external CSS styling.</p>
    
    <!-- ID Selector -->
    <div id="special-box">
        <p>This element uses ID selector for unique styling.</p>
    </div>
    
    <!-- Class Selector -->
    <div class="container">
        <p class="text-highlight">This text is highlighted.</p>
    </div>
</body>
</html>
