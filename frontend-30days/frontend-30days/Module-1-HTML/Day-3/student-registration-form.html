<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form - Day 3 Mini Project</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    
    <form>
        <!-- Text Input -->
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" required>
        <br><br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" required>
        <br><br>

        <!-- Email Input -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- Phone Input -->
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <!-- Date Input -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <!-- Select Dropdown -->
        <label for="course">Select Course:</label>
        <select id="course" name="course">
            <option>-- Select Course --</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="react">React</option>
        </select>
        <br><br>

        <!-- Checkboxes -->
        <label>Skills:</label><br>
        <input type="checkbox" name="skills" value="html"> HTML
        <input type="checkbox" name="skills" value="css"> CSS
        <input type="checkbox" name="skills" value="javascript"> JavaScript
        <br><br>

        <!-- Radio Buttons -->
        <label>Experience Level:</label><br>
        <input type="radio" name="experience" value="beginner"> Beginner
        <input type="radio" name="experience" value="intermediate"> Intermediate
        <input type="radio" name="experience" value="advanced"> Advanced
        <br><br>

        <!-- Textarea -->
        <label for="message">Comments:</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea>
        <br><br>

        <!-- Buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Clear</button>
    </form>

    <hr>
    
    <!-- Table Example -->
    <h2>Sample Course Schedule</h2>
    <table border="1">
        <tr>
            <th>Day</th>
            <th>Topic</th>
            <th>Duration</th>
        </tr>
        <tr>
            <td>Day 1</td>
            <td>HTML Basics</td>
            <td>3 Hours</td>
        </tr>
        <tr>
            <td>Day 2</td>
            <td>HTML Elements</td>
            <td>3 Hours</td>
        </tr>
        <tr>
            <td>Day 3</td>
            <td>Forms & Tables</td>
            <td>3 Hours</td>
        </tr>
    </table>
</body>
</html>
